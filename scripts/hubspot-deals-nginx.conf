# Add this location inside the TLS server block for the trusted-hermes Droplet.
# The upstream binds only to loopback; the Python service validates the bearer token.
location = /hubspot-deals {
    proxy_pass http://127.0.0.1:8650/deals;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
}
